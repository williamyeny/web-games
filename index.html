<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1E52" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games">
<title>Games</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:wght,CASL,MONO@300..1000,0..1,0..1&display=swap">
<style>
  :root {
    --paper: #F4F6FB;
    --grid: rgba(45, 80, 190, 0.075);
    --ink: #1C2A66;
    --ink-2: #4E5A86;
    --card: #FFFFFF;
    --edge: #1C2A66;
    --drop: #1C2A66;
    --hi: #FFE141;
    --on-hi: #1C2A66;
    --focus: #2F6BFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F1E52;
      --grid: rgba(170, 195, 255, 0.07);
      --ink: #EEF2FF;
      --ink-2: #AAB6DE;
      --card: #1A2D6F;
      --edge: #DCE3FF;
      --drop: #050C2B;
      --focus: #8FB0FF;
      color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  * { font-variation-settings: "CASL" var(--casl, 0), "MONO" var(--mono, 0); }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Recursive", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.4;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    max-width: 560px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 48px) 20px calc(env(safe-area-inset-bottom) + 40px);
  }

  h1 {
    --casl: 1;
    margin: 0 0 20px;
    font-size: 34px; font-weight: 950;
    line-height: 1; letter-spacing: -0.02em;
  }

  .games { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px; }

  .game {
    display: grid;
    grid-template-columns: 72px 1fr;
    align-items: center; gap: 16px;
    padding: 14px 16px 14px 14px;
    border: 2.5px solid var(--edge); border-radius: 20px;
    background: var(--card);
    box-shadow: 0 5px 0 var(--drop);
    color: inherit; text-decoration: none;
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .game:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--drop); }
  .game:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .game img {
    width: 72px; height: 72px;
    border-radius: 16px; border: 2.5px solid var(--edge);
  }
  .game-name { --casl: 1; display: block; font-size: 22px; font-weight: 900; line-height: 1.1; }
  .game-blurb { display: block; margin-top: 3px; color: var(--ink-2); font-weight: 550; }
  .game-progress {
    display: block; margin-top: 10px;
    font-size: 0.875rem; font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .game-progress b { --casl: 1; font-size: 1.125rem; font-weight: 950; }
  .game-progress:empty { display: none; }
  .game-go {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: center;
    min-height: 52px; margin-top: 4px;
    border-radius: 14px;
    background: var(--ink); color: var(--paper);
    font-size: 1.0625rem; font-weight: 850;
  }
  .game-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .game-new {
    display: inline-block; margin-top: 8px; padding: 2px 10px;
    border-radius: 999px;
    background: var(--ink); color: var(--paper);
    font-size: 0.8125rem; font-weight: 800;
    animation: pop 0.5s cubic-bezier(.3,1.6,.5,1) 0.3s both;
  }
  .game-new[hidden] { display: none; }
  @keyframes pop { from { transform: scale(0); } }

  footer { margin-top: 36px; font-size: 0.8125rem; color: var(--ink-2); }
  footer a { color: inherit; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    .game, .game-new { transition: none; animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Games</h1>

  <ul class="games">
    <li>
      <a class="game" href="universal-paperclips/">
        <img src="universal-paperclips/icon.svg" alt="">
        <span>
          <span class="game-name">Universal Paperclips</span>
          <span class="game-blurb">Make paperclips. Then make more.</span>
          <span class="game-progress" id="paperclips-progress"></span>
          <span class="game-tags">
            <span class="game-new" id="paperclips-new" hidden>Updated</span>
          </span>
        </span>
        <span class="game-go" id="paperclips-go">Play</span>
      </a>
    </li>
  </ul>

  <footer>
    Universal Paperclips is by Frank Lantz. The original is at
    <a href="https://www.decisionproblem.com/paperclips/">decisionproblem.com</a>.
  </footer>
</main>

<script src="universal-paperclips/changelog.js"></script>
<script>
  // Show how far along the saved paperclips game is, and whether it has news.
  (function () {
    var names = ['', 'thousand', 'million', 'billion', 'trillion', 'quadrillion', 'quintillion',
      'sextillion', 'septillion', 'octillion', 'nonillion', 'decillion', 'undecillion',
      'duodecillion', 'tredecillion', 'quattuordecillion', 'quindecillion', 'sexdecillion',
      'septendecillion'];
    function words(n) {
      if (n < 1e6) return Math.floor(n).toLocaleString('en-US');
      var i = Math.min(names.length - 1, Math.floor(Math.log10(n) / 3));
      var v = n / Math.pow(1000, i);
      return (v >= 100 ? Math.floor(v) : Math.floor(v * (v >= 10 ? 10 : 100)) / (v >= 10 ? 10 : 100)) + ' ' + names[i];
    }
    function hours(s) {
      var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
      return h ? h + 'h ' + m + 'm' : m + 'm';
    }
    // Where the saved game is: which universe, which stage, how many clips.
    try {
      var save = JSON.parse(localStorage.getItem('saveGame'));
      var plusData = null;
      try { plusData = JSON.parse(localStorage.getItem('up-plus')); } catch (e) { plusData = null; }
      var parts = [];
      if (plusData && plusData.universe > 1) parts.push('Universe ' + plusData.universe);
      if (save) {
        var stage = save.milestoneFlag >= 15 ? 'The end' : save.spaceFlag == 1 ? 'Space' : save.humanFlag == 0 ? 'Earth' : 'Business';
        if (save.clips > 0) parts.push(stage);
        if (plusData && plusData.run && plusData.run.playSeconds > 60) parts.push(hours(plusData.run.playSeconds) + ' played');
      }
      if (save && save.clips > 0) {
        var el = document.getElementById('paperclips-progress');
        el.innerHTML = '<b></b> clips<br>';
        el.querySelector('b').textContent = words(save.clips);
        el.appendChild(document.createTextNode(parts.join(', ')));
        document.getElementById('paperclips-go').textContent = 'Continue';
      }
    } catch (e) { /* no save yet */ }
    try {
      var plus = JSON.parse(localStorage.getItem('up-plus'));
      var log = window.CHANGELOG || [];
      if (plus && log.length && plus.seenLog !== log[0].id) document.getElementById('paperclips-new').hidden = false;
    } catch (e) { /* nothing seen yet */ }
  })();
</script>
<script>
  // Works offline, and asks the browser to keep saved games around.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
</script>
</body>
</html>
